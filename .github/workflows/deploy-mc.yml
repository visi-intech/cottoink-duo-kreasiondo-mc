# Auto deploy ke server MC (172.16.151.29)
# Jalan di self-hosted runner yang dipasang di server MC (label: mc).
name: Deploy MC

on:
  push:
    branches: [main]
    paths:
      - 'custom_addon/**'
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

concurrency:
  group: deploy-mc
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy MC (172.16.151.29)
    runs-on: [self-hosted, windows, mc]
    env:
      ODOO_DIR: 'C:\Program Files\Odoo 17.0.20250624'
      ADDONS_TARGET: 'C:\Program Files\Odoo 17.0.20250624\server\POSVIT\cottoink-duo-kreasiondo-mc\custom_addon'
      ODOO_SERVICE: 'odoo-server-17.0'
      ODOO_DB: 'cdk_testing_2026'
      # Odoo hanya meng-upgrade modul yang sudah ter-install, yang belum di-skip
      MODULES: 'dev_pos,report_pos,vit_transfer_request,stock_no_negative,pos_session_sequence'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy custom_addon ke server
        shell: powershell
        run: |
          robocopy "$env:GITHUB_WORKSPACE\custom_addon" "$env:ADDONS_TARGET" /MIR /XD __pycache__ /XF *.pyc /NFL /NDL /NP
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }   # robocopy: 0-7 = sukses
          exit 0

      - name: Stop Odoo
        shell: powershell
        run: Stop-Service -Name $env:ODOO_SERVICE -Force

      - name: Upgrade modul
        shell: powershell
        run: |
          & "$env:ODOO_DIR\python\python.exe" "$env:ODOO_DIR\server\odoo-bin" `
            -c "$env:ODOO_DIR\server\odoo.conf" -d $env:ODOO_DB `
            -u $env:MODULES --stop-after-init
          exit $LASTEXITCODE

      - name: Start Odoo
        if: always()                     # tetap start walau upgrade gagal
        shell: powershell
        run: Start-Service -Name $env:ODOO_SERVICE

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -Uri "http://localhost:8069/web/login" -UseBasicParsing -TimeoutSec 60
          if ($r.StatusCode -ne 200) { exit 1 }
          Write-Output "Odoo MC up"
